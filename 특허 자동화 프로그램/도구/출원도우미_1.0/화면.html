<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>특허 출원 안내</title>
<style>
/* ── 색 · 글자 ────────────────────────────────────────────────
   관공서 서류를 다루는 도구다. 신뢰가 먼저고 멋은 그다음이다.
   남색은 관청, 초록은 됨, 붉은색은 막힘. 뜻이 색 하나에만 걸리지 아니하도록
   모든 상태에 아이콘과 글을 함께 둔다.                                    */
:root{
  --ground:#F4F6F8; --panel:#FFFFFF; --panel2:#F8FAFC; --sunken:#EEF1F5;
  --ink:#0F172A; --ink-soft:#475569; --ink-faint:#64748B;
  --rule:#DDE3EA; --rule-firm:#C3CCD6;
  --navy:#1E3A5F; --navy-ink:#FFFFFF; --navy-wash:#E8EDF3; --navy-line:#B9C7D8;
  --go:#047857; --go-wash:#E7F3EE; --go-line:#A9D3C3;
  --stop:#B91C1C; --stop-wash:#FBEBEB; --stop-line:#E8B4B4;
  --hold:#92600B; --hold-wash:#FBF2E0; --hold-line:#E3CB94;
  --sans:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  --serif:"Gowun Batang","바탕",Batang,serif;
  --mono:Consolas,"D2Coding",ui-monospace,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.05);
  --s1:8px; --s2:12px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ground:#0D1520; --panel:#141E2B; --panel2:#182434; --sunken:#101A26;
  --ink:#E8EDF3; --ink-soft:#A3B2C2; --ink-faint:#8B9BAC;
  --rule:#26364A; --rule-firm:#36495F;
  --navy:#7BA7D4; --navy-ink:#0D1520; --navy-wash:#152438; --navy-line:#2E4763;
  --go:#5FBF9C; --go-wash:#0F2620; --go-line:#255043;
  --stop:#F08D8D; --stop-wash:#2A1416; --stop-line:#59292C;
  --hold:#E0BC6E; --hold-wash:#2A2213; --hold-line:#544527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
body{margin:0;background:var(--ground);color:var(--ink);
  font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--navy);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:4px}
.wrap{max-width:920px;margin:0 auto;padding:0 var(--s4)}
@media(max-width:640px){.wrap{padding:0 var(--s3)}}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.13em}

/* ── 표제 ─────────────────────────────────────────── */
header{background:var(--panel);border-bottom:1px solid var(--rule);
  position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) 0;flex-wrap:wrap}
.hd h1{margin:0;font:600 20px/1.3 var(--sans);letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px}
.hd h1 svg{color:var(--navy);width:22px;height:22px}
.ver{font:500 12px var(--mono);color:var(--ink-faint);
  border:1px solid var(--rule);border-radius:99px;padding:4px 10px}

/* 진행 레일 — 지금 어디에 있는지 늘 보인다 */
.rail{display:flex;gap:2px;padding:0 0 var(--s2);overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:1;min-width:74px;min-height:44px;background:none;border:0;
  border-top:3px solid var(--rule);padding:9px 6px 5px;cursor:pointer;
  font:500 12px/1.35 var(--sans);color:var(--ink-faint);text-align:left;
  transition:color .2s,border-color .2s}
.rail button:hover{color:var(--ink)}
.rail button .n{display:block;font:600 11px var(--mono);opacity:.75}
.rail button[data-s=done]{border-top-color:var(--go);color:var(--go)}
.rail button[data-s=stop]{border-top-color:var(--stop);color:var(--stop)}
.rail button[aria-current=step]{border-top-color:var(--navy);color:var(--navy);font-weight:700}

/* ── 안내글 ───────────────────────────────────────── */
main{padding:var(--s5) 0 120px}
.lead{background:var(--navy-wash);border:1px solid var(--navy-line);
  border-radius:var(--r);padding:var(--s3) var(--s4);margin:0 0 var(--s5);
  word-break:keep-all;text-wrap:pretty}
.lead h2{margin:0 0 6px;font:600 18px/1.4 var(--sans)}
.lead p{margin:0;color:var(--ink-soft)}

/* ── 마당 ─────────────────────────────────────────── */
.step{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  margin-bottom:var(--s3);box-shadow:var(--shadow);overflow:hidden}
.step>summary{cursor:pointer;padding:var(--s3) var(--s4);display:flex;
  align-items:center;gap:var(--s3);list-style:none;min-height:64px}
.step>summary::-webkit-details-marker{display:none}
.step>summary:hover{background:var(--panel2)}
.step[open]>summary{border-bottom:1px solid var(--rule)}
.no{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font:600 14px var(--mono);background:var(--sunken);color:var(--ink-faint);
  border:2px solid var(--rule)}
.step[data-s=done] .no{background:var(--go-wash);color:var(--go);border-color:var(--go-line)}
.step[data-s=stop] .no{background:var(--stop-wash);color:var(--stop);border-color:var(--stop-line)}
.ttl{font:600 17px/1.35 var(--sans);flex:1;min-width:0}
.ttl small{display:block;font:400 13px/1.45 var(--sans);color:var(--ink-faint);
  margin-top:2px}
.pill{flex:none;font:600 12px/1 var(--sans);padding:7px 11px;border-radius:99px;
  background:var(--sunken);color:var(--ink-faint);border:1px solid var(--rule);
  display:flex;align-items:center;gap:5px}
.step[data-s=done] .pill{background:var(--go-wash);color:var(--go);border-color:var(--go-line)}
.step[data-s=stop] .pill{background:var(--stop-wash);color:var(--stop);border-color:var(--stop-line)}
.body{padding:var(--s4)}
.hint{color:var(--ink-soft);margin:0 0 var(--s3);word-break:keep-all;text-wrap:pretty}

/* ── 표 ───────────────────────────────────────────── */
.tw{overflow-x:auto;margin:0 0 var(--s3);border:1px solid var(--rule);
  border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:12px var(--s3);text-align:left;vertical-align:top;
  border-bottom:1px solid var(--rule)}
tr:last-child th,tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--ink-soft);white-space:nowrap;width:1%;
  background:var(--panel2)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;
  white-space:nowrap}
tr.bad td,tr.bad th{background:var(--stop-wash)}
tr.warn td,tr.warn th{background:var(--hold-wash)}
.sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;word-break:keep-all}
.src{color:var(--ink-faint);font-size:12.5px;margin-top:2px}

/* ── 단추 ─────────────────────────────────────────── */
button,.btn{font:600 15px var(--sans);min-height:44px;padding:11px 18px;
  border:1px solid var(--rule-firm);border-radius:8px;background:var(--panel);
  color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;
  transition:background .2s,border-color .2s,color .2s}
button:hover:not(:disabled),.btn:hover{background:var(--panel2);border-color:var(--navy)}
button.p{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
button.p:hover:not(:disabled){filter:brightness(1.12)}
button.sm{min-height:36px;padding:7px 13px;font-size:13.5px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.next{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--rule)}

input[type=text],input[type=password]{font:15px var(--mono);min-height:44px;
  padding:10px var(--s2);border:1px solid var(--rule-firm);border-radius:8px;
  background:var(--panel2);color:var(--ink);width:100%;max-width:100%}
input::placeholder{color:var(--ink-faint)}
label{display:block;font:600 14px var(--sans);margin-bottom:5px}

/* ── 출원건 고르기 ─────────────────────────────────── */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:var(--s2)}
.case{text-align:left;align-items:flex-start;flex-direction:column;gap:5px;
  padding:var(--s3);height:auto;line-height:1.5}
.case[aria-pressed=true]{border-color:var(--navy);background:var(--navy-wash);
  box-shadow:inset 0 0 0 1px var(--navy)}
.case b{font:600 15.5px var(--sans);display:block}
.case span{color:var(--ink-faint);font:400 13px/1.45 var(--sans);display:block}
.case .meta{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

/* ── 알림 ─────────────────────────────────────────── */
.note{padding:var(--s3);border:1px solid var(--rule);border-left-width:4px;
  border-radius:8px;margin:0 0 var(--s2);display:flex;gap:11px;
  align-items:flex-start;word-break:keep-all}
.note svg{width:19px;height:19px;margin-top:2px}
.note b{display:block;font:600 15.5px var(--sans);margin-bottom:2px}
.note p{margin:0;color:var(--ink-soft);font-size:14.5px}
.note.ok{background:var(--go-wash);border-color:var(--go-line);border-left-color:var(--go)}
.note.ok svg{color:var(--go)}
.note.bad{background:var(--stop-wash);border-color:var(--stop-line);border-left-color:var(--stop)}
.note.bad svg{color:var(--stop)}
.note.warn{background:var(--hold-wash);border-color:var(--hold-line);border-left-color:var(--hold)}
.note.warn svg{color:var(--hold)}
.empty{color:var(--ink-faint);padding:var(--s5) var(--s3);text-align:center;
  background:var(--panel2);border-radius:8px;word-break:keep-all}
.spin{display:inline-block;width:14px;height:14px;margin-right:8px;
  border:2px solid var(--rule-firm);border-top-color:var(--navy);border-radius:50%;
  animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.won{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;
  font-weight:700;color:var(--navy)}

/* ── 아래 요약 띠 ─────────────────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--rule);box-shadow:0 -4px 18px rgba(15,23,42,.07);
  padding:var(--s2) 0;display:none}
.bar.on{display:block}
.bar .wrap{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.bar dl{display:flex;gap:var(--s4);margin:0;flex:1;flex-wrap:wrap}
.bar div{display:flex;flex-direction:column}
.bar dt{font:500 11.5px var(--sans);color:var(--ink-faint)}
.bar dd{margin:0;font:600 14.5px var(--sans);font-variant-numeric:tabular-nums}
</style></head><body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
    <path d="M9 13h6M9 17h6"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/>
    <path d="M12 8v5M12 16.5v.01"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    <path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
    <path d="M15 3h6v6M10 14 21 3"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/>
    <path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-build" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
    <circle cx="12" cy="12" r="3.2"/></symbol>
</svg>

<header>
  <div class="wrap">
    <div class="hd">
      <h1><svg class="i"><use href="#i-doc"/></svg>특허 출원 안내</h1>
      <span class="ver" id="ver">준비 중</span>
    </div>
    <nav class="rail" id="rail" aria-label="진행 차례"></nav>
  </div>
</header>

<main class="wrap">
  <div class="lead">
    <h2>특허를 처음 내시나요</h2>
    <p>아래 일곱 마당을 위에서부터 차례로 따라가면 됩니다. 각 마당이 무엇인지와
    무엇을 눌러야 하는지 함께 적어 두었습니다. 어려운 말은 쓰지 않았습니다.</p>
  </div>
  <div id="steps"></div>
</main>

<div class="bar" id="bar"><div class="wrap">
  <dl id="barinfo"></dl>
  <button class="p sm" id="barnext" onclick="다음마당()">
    다음 <svg class="i"><use href="#i-next"/></svg></button>
</div></div>

<script src="화면.js"></script>
</body></html>
